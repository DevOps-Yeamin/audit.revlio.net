version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revlio-audit-backend
    restart: always
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./revlio_audit.db
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID:-}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET:-}
      - ZOHO_REFRESH_TOKEN=${ZOHO_REFRESH_TOKEN:-}
      - ZOHO_LIST_KEY=${ZOHO_LIST_KEY:-}
      - ZOHO_REPLY_TO_EMAIL=hello@revlio.net
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: revlio-audit-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
